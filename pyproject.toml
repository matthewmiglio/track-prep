[tool.poetry]
name = "instrumental-lyric-separator"
version = "2.0.0"
description = "Toolkit: YouTube download, vocal/instrumental separation (BS-RoFormer), and BPM detection + beat-snap cutting."
authors = ["matt"]
package-mode = false

# NOTE: torch (cu121), audio-separator and aubio are installed into the in-project
# venv via pip in a specific order (see setup_env.ps1) because they need a custom
# index / a compiled build that Poetry's resolver handles poorly. Poetry owns the
# cleanly-resolvable deps below; audio-separator transitively brings librosa,
# soundfile, numpy, scipy, etc.
[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.23,<2"          # <2 required by audio-separator 0.28
pydub = "^0.25"              # ffmpeg-backed format conversion + beat-cutting
yt-dlp = ">=2024"            # YouTube download
python-slugify = "^8.0"      # slugify video titles into filenames

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
